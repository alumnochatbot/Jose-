<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Brawl - Web Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        .hidden { display: none !important; }

    </style>
</head>
<body>

    <!-- Canvas del Juego -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI: HUD -->
    <div id="hud" class="ui-layer p-4 hidden">
        <div class="flex justify-between items-start">
            <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600">

                <div class="w-64 h-3 bg-gray-700 rounded-full mt-2 overflow-hidden">
                    <div id="ui-xp-bar" class="h-full bg-blue-500 w-0 transition-all duration-200"></div>
                </div>
            </div>
            <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-600 text-right">

            <p class="text-gray-300 mb-8">Sobrevive a la horda. WASD o Flechas para moverte. El ataque es automático.</p>
            <div class="flex flex-col gap-4 items-center">
                <button id="btn-start" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xl transition-transform transform hover:scale-105 shadow-lg shadow-red-500/30">
                    Iniciar Supervivencia

                <!-- Las opciones se inyectan via JS -->
            </div>
        </div>
    </div>

    <!-- UI: Game Over -->
    <div id="game-over-screen" class="ui-layer interactive items-center justify-center bg-red-900/90 hidden">
        <div class="glass-panel p-10 rounded-2xl text-center">
            <h2 class="text-5xl font-bold text-white mb-4">HAS CAÍDO</h2>
            <p class="text-xl text-red-200 mb-2">Sobreviviste: <span id="go-time" class="font-bold text-white"></span></p>
            <p class="text-xl text-red-200 mb-2">Nivel Alcanzado: <span id="go-level" class="font-bold text-white"></span></p>
            <p class="text-2xl text-yellow-400 mb-8 font-bold">Puntos Obtenidos: <span id="go-points" class="text-white"></span></p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">

                    Reintentar

                <button id="btn-to-shop-from-go" class="px-6 py-4 bg-blue-600 text-white hover:bg-blue-500 font-bold rounded-xl text-xl transition-transform transform hover:scale-105 shadow-lg shadow-blue-500/30">
                    Tienda
                </button>
                <button id="btn-to-menu" class="px-6 py-4 bg-gray-800 text-white hover:bg-gray-700 border border-gray-600 font-bold rounded-xl text-xl transition-transform transform hover:scale-105">
                    Menú
                </button>
            </div>
        </div>
    </div>

    <!-- UI: Tienda -->
    <div id="shop-screen" class="ui-layer interactive items-center justify-center bg-black/95 hidden">
        <div class="glass-panel p-10 rounded-2xl text-center w-full max-w-5xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-4xl font-bold text-blue-400 mb-2">TIENDA DE SKINS</h2>
            <p class="text-xl text-gray-300 mb-8">Puntos Totales: <span id="shop-points" class="font-bold text-yellow-400 text-3xl">0</span></p>
            <div id="shop-items" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 mb-8">
                <!-- Las opciones se inyectan via JS -->
            </div>
            <button id="btn-close-shop" class="px-8 py-4 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-xl text-xl transition-transform transform hover:scale-105">
                Volver al Menú
            </button>
        </div>
    </div>

<script>
/**
 * ARQUITECTURA DEL SISTEMA - ACTION ROGUELIKE
 * Implementación de Object Pooling, Spatial Hashing y Core Loop.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- SISTEMA DE RESOLUCIÓN Y RESIZE ---
let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- ESTADO GLOBAL ---
const GAME_STATE = {
    MENU: 0,
    PLAYING: 1,
    LEVEL_UP: 2,
    GAME_OVER: 3,
    SHOP: 4
};
let currentState = GAME_STATE.MENU;
let lastTime = 0;
let gameTimer = 0;

// --- SISTEMA DE PUNTOS Y SKINS ---
let totalPoints = 0;
let unlockedSkins = ['verde'];
let currentSkinId = 'verde';

const skinsDB = [
    { id: 'verde', name: 'Slime Verde', color: '#4ade80', price: 0 },
    { id: 'rojo', name: 'Lava Caliente', color: '#ef4444', price: 1000 },
    { id: 'azul', name: 'Hielo Profundo', color: '#3b82f6', price: 3000 },
    { id: 'purpura', name: 'Materia Oscura', color: '#9333ea', price: 6000 },
    { id: 'dorado', name: 'Rey Dorado', color: '#eab308', price: 10000 }
];

function calculatePoints(level) {
    if (level === 1) return 100;
    if (level === 2) return 500;
    // Escala matemática para niveles superiores a 2
    return 500 + Math.floor(Math.pow(level - 1, 1.5) * 200); 
}

// --- INPUT ---
const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

// --- MATEMÁTICAS Y UTILIDADES ---
function distSq(x1, y1, x2, y2) { return (x2-x1)**2 + (y2-y1)**2; }
function randRange(min, max) { return Math.random() * (max - min) + min; }

// --- SPATIAL HASHING (Optimización de Colisiones) ---
class SpatialGrid {
    constructor(cellSize) {
        this.cellSize = cellSize;
        this.cells = new Map();
    }
    clear() { this.cells.clear(); }
    hash(x, y) {
        return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`;
    }
    insert(entity) {
        const key = this.hash(entity.x, entity.y);
        if (!this.cells.has(key)) this.cells.set(key, []);
        this.cells.get(key).push(entity);
    }
    getNearby(x, y, radius) {
        const result = [];
        const minKeyX = Math.floor((x - radius) / this.cellSize);
        const maxKeyX = Math.floor((x + radius) / this.cellSize);
        const minKeyY = Math.floor((y - radius) / this.cellSize);
        const maxKeyY = Math.floor((y + radius) / this.cellSize);

        for (let cx = minKeyX; cx <= maxKeyX; cx++) {
            for (let cy = minKeyY; cy <= maxKeyY; cy++) {
                const cell = this.cells.get(`${cx},${cy}`);
                if (cell) result.push(...cell);
            }
        }
        return result;
    }
}

// --- OBJECT POOLING ---
class ObjectPool {
    constructor(createFn) {
        this.pool = [];
        this.createFn = createFn;
    }
    get() { return this.pool.length > 0 ? this.pool.pop() : this.createFn(); }
    release(obj) { this.pool.push(obj); }
}

// --- ENTIDADES ---
class Player {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = width / 2;
        this.y = height / 2;
        this.radius = 15;
        this.speed = 200; // px por segundo
        this.maxHp = 100;
        this.hp = 100;
        this.level = 1;
        this.xp = 0;
        this.maxXp = 10;
        
        // Atributos base para eDPS
        this.baseDamageMult = 1.0;
        this.critChance = 0.05;
        this.critMult = 1.5;
        
        // Arsenal
        this.weapons = [new RapidEggsWeapon(this)];
        // this.weapons.push(new DarkEnergyWeapon(this)); // Desbloqueable
    }

    update(dt) {
        let dx = 0, dy = 0;
        if (keys.w || keys.ArrowUp) dy -= 1;
        if (keys.s || keys.ArrowDown) dy += 1;
        if (keys.a || keys.ArrowLeft) dx -= 1;
        if (keys.d || keys.ArrowRight) dx += 1;

        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx*dx + dy*dy);
            dx /= length; dy /= length;
        }

        this.x += dx * this.speed * dt;
        this.y += dy * this.speed * dt;

        // Mantener dentro del mapa (infinito visualmente, pero limitaremos por ahora al tamaño de un arena grande)
        this.x = Math.max(-1000, Math.min(width + 1000, this.x));
        this.y = Math.max(-1000, Math.min(height + 1000, this.y));

        // Actualizar armas
        this.weapons.forEach(w => w.update(dt));
    }

    draw(ctx, camX, camY) {
        const skinInfo = skinsDB.find(s => s.id === currentSkinId);
        ctx.fillStyle = skinInfo ? skinInfo.color : '#4ade80';
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Draw Dark Energy Aura if active
        this.weapons.forEach(w => {
            if(w.draw) w.draw(ctx, camX, camY);
        });
    }

    takeDamage(amount) {
        this.hp -= amount;
        updateHUD();
        if (this.hp <= 0) {
            gameOver();
        }
    }

    addXp(amount) {
        this.xp += amount;
        if (this.xp >= this.maxXp) {
            this.xp -= this.maxXp;
            this.levelUp();
        }
        updateHUD();
    }

    levelUp() {
        this.level++;
        this.maxXp = Math.floor(10 * Math.pow(this.level, 1.5)); // Curva de escalado
        this.hp = Math.min(this.maxHp, this.hp + 20); // Cura parcial al subir
        triggerDraft();
    }
}

class Enemy {
    constructor() { this.active = false; }
    spawn(x, y, hp, speed, damage, radius, color) {
        this.x = x; this.y = y;
        this.maxHp = hp; this.hp = hp;
        this.speed = speed;
        this.damage = damage;
        this.radius = radius;
        this.color = color;
        this.active = true;
        this.knockbackX = 0;
        this.knockbackY = 0;
    }
    update(dt, px, py) {
        // Throttling implícito: Movimiento directo hacia el jugador
        let dx = px - this.x;
        let dy = py - this.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            this.x += (dx/dist) * this.speed * dt;
            this.y += (dy/dist) * this.speed * dt;
        }

        // Aplicar knockback
        this.x += this.knockbackX * dt;
        this.y += this.knockbackY * dt;
        this.knockbackX *= 0.9; // Fricción
        this.knockbackY *= 0.9;
    }
    draw(ctx, camX, camY) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    takeDamage(amount, isCrit, kx, ky) {
        this.hp -= amount;
        this.knockbackX = kx * 300;
        this.knockbackY = ky * 300;
        
        spawnFloatingText(this.x, this.y, Math.floor(amount), isCrit);

        if (this.hp <= 0) {
            this.active = false;
            spawnXpOrb(this.x, this.y, 1);
            return true; // Muerto
        }
        return false; // Vivo
    }
}

class Projectile {
    constructor() { this.active = false; }
    spawn(x, y, vx, vy, speed, damage, size, color, isCrit, pierce = 1) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.speed = speed;
        this.damage = damage;
        this.radius = size;
        this.color = color;
        this.isCrit = isCrit;
        this.pierce = pierce; // Cuantos enemigos atraviesa
        this.active = true;
        this.life = 2.0; // segundos
        this.hitTargets = new Set();
    }
    update(dt) {
        this.x += this.vx * this.speed * dt;
        this.y += this.vy * this.speed * dt;
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx, camX, camY) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class XpOrb {
    constructor() { this.active = false; }
    spawn(x, y, value) {
        this.x = x; this.y = y;
        this.value = value;
        this.radius = 4;
        this.active = true;
    }
    draw(ctx, camX, camY) {
        ctx.fillStyle = '#3b82f6'; // Azul orbe
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#60a5fa';
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
    }
}

class FloatingText {
    constructor() { this.active = false; }
    spawn(x, y, text, isCrit) {
        this.x = x + randRange(-10, 10);
        this.y = y - 10;
        this.text = text;
        this.isCrit = isCrit;
        this.active = true;
        this.life = 0.5; // segundos
        this.maxLife = 0.5;
    }
    update(dt) {
        this.y -= 30 * dt; // Flota hacia arriba
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx, camX, camY) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha;
        
        // Colorimetría del daño (Jugo)
        ctx.fillStyle = this.isCrit ? '#facc15' : '#f87171'; // Amarillo crítico, Rojo normal
        ctx.font = this.isCrit ? 'bold 20px sans-serif' : 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x - camX, this.y - camY);
        
        ctx.globalAlpha = 1.0;
    }
}

// --- ARMAS (Basado en el Diccionario) ---

class RapidEggsWeapon {
    constructor(player) {
        this.player = player;
        this.cooldown = 0.5;
        this.timer = 0;
        this.baseDamage = 5;
        this.level = 1;
        this.name = "Rapid Eggs";
    }
    update(dt) {
        this.timer -= dt;
        if (this.timer <= 0) {
            this.fire();
            this.timer = Math.max(0.1, this.cooldown - (this.level * 0.02)); // Escala velocidad
        }
    }
    fire() {
        // Apuntado automático: Buscar enemigo más cercano
        let closest = null;
        let minDist = Infinity;
        for (let e of enemies) {
            if (!e.active) continue;
            let d = distSq(this.player.x, this.player.y, e.x, e.y);
            if (d < minDist) { minDist = d; closest = e; }
        }

        if (closest && Math.sqrt(minDist) < 600) { // Rango de visión
            let dx = closest.x - this.player.x;
            let dy = closest.y - this.player.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            // Fórmulas de eDPS aplicadas (Crítico)
            let isCrit = Math.random() < this.player.critChance;
            let damage = this.baseDamage * this.player.baseDamageMult * (1 + (this.level * 0.2));
            if (isCrit) damage *= this.player.critMult;

            const proj = projectilePool.get();
            proj.spawn(this.player.x, this.player.y, dx/dist, dy/dist, 400, damage, 5, '#fef08a', isCrit, 1);
            projectiles.push(proj);
        }
    }
}

class DarkEnergyWeapon {
    constructor(player) {
        this.player = player;
        this.timer = 0;
        this.tickRate = 0.5; // Daño cada medio segundo
        this.baseDamage = 3;
        this.level = 1;
        this.radius = 80;
        this.name = "Dark Energy";
    }
    update(dt) {
        this.timer -= dt;
        this.radius = 80 + (this.level * 10); // Aumenta área por nivel
        
        if (this.timer <= 0) {
            this.pulse();
            this.timer = this.tickRate;
        }
    }
    pulse() {
        let isCrit = Math.random() < this.player.critChance;
        let damage = this.baseDamage * this.player.baseDamageMult * (1 + (this.level * 0.15));
        if (isCrit) damage *= this.player.critMult;

        const rSq = this.radius * this.radius;
        for (let e of enemies) {
            if (!e.active) continue;
            let dSq = distSq(this.player.x, this.player.y, e.x, e.y);
            if (dSq <= rSq) {
                // Pequeño knockback hacia afuera
                let dx = e.x - this.player.x;
                let dy = e.y - this.player.y;
                let dist = Math.sqrt(dx*dx + dy*dy) || 1;
                e.takeDamage(damage, isCrit, dx/dist, dy/dist);
            }
        }
    }
    draw(ctx, camX, camY) {
        ctx.fillStyle = 'rgba(147, 51, 234, 0.2)'; // Morado transparente
        ctx.beginPath();
        ctx.arc(this.player.x - camX, this.player.y - camY, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

// --- POOLS Y COLECCIONES GLOBAL ---
const enemyPool = new ObjectPool(() => new Enemy());
const projectilePool = new ObjectPool(() => new Projectile());
const xpPool = new ObjectPool(() => new XpOrb());
const textPool = new ObjectPool(() => new FloatingText());

const enemies = [];
const projectiles = [];
const xpOrbs = [];
const floatingTexts = [];

const enemyGrid = new SpatialGrid(100);

let player;

// --- WAVE SPAWNER ---
let spawnTimer = 0;
function updateWaveSpawner(dt) {
    spawnTimer -= dt;
    
    // Curva de escalado (Ecuación de Desgaste)
    // Enemigos aparecen más rápido y con más HP conforme pasa el tiempo
    let spawnRate = Math.max(0.1, 1.0 - (gameTimer / 120)); // De 1s a 0.1s
    
    if (spawnTimer <= 0) {
        spawnTimer = spawnRate;
        
        // Calcular HP enemigo usando fórmula base de desgaste para mantener balance
        // Base HP 5 (Ice Slime) escalando
        let enemyHp = 5 + Math.floor(gameTimer / 10) * 2; 
        let enemyDamage = 5 + Math.floor(gameTimer / 30) * 5;
        let enemySpeed = 100 + Math.min(100, gameTimer / 2);

        // Spawn fuera de la pantalla
        let angle = Math.random() * Math.PI * 2;
        let dist = Math.max(width, height) / 2 + 100; // Justo fuera de la vista
        let sx = player.x + Math.cos(angle) * dist;
        let sy = player.y + Math.sin(angle) * dist;

        const enemy = enemyPool.get();
        // Colores varían por dificultad
        let color = enemyHp < 15 ? '#ef4444' : (enemyHp < 30 ? '#d946ef' : '#1e3a8a');
        enemy.spawn(sx, sy, enemyHp, enemySpeed, enemyDamage, 12, color);
        enemies.push(enemy);
    }
}

function spawnXpOrb(x, y, val) {
    // XP Culling: Si hay demasiados orbes, no spawneamos visualmente, pero podríamos dar XP directo
    let activeOrbs = xpOrbs.filter(o => o.active).length;
    if (activeOrbs > 500) {
        player.addXp(val); // Autorecolección por rendimiento
        return;
    }
    const orb = xpPool.get();
    orb.spawn(x, y, val);
    xpOrbs.push(orb);
}

function spawnFloatingText(x, y, text, isCrit) {
    const ft = textPool.get();
    ft.spawn(x, y, text, isCrit);
    floatingTexts.push(ft);
}

// --- SISTEMA DE DRAFT (Mejoras) ---
const draftOptionsDatabase = [
    { id: 'dmg', title: 'Daño Base +', desc: 'Aumenta todo el daño un 20%', apply: () => player.baseDamageMult += 0.2 },
    { id: 'crit', title: 'Ojo Crítico', desc: 'Probabilidad crítica +10%', apply: () => player.critChance += 0.1 },
    { id: 'hp', title: 'Salud Máxima', desc: 'Aumenta HP Max en 30', apply: () => { player.maxHp += 30; player.hp += 30; } },
    { id: 'rapid_eggs', title: 'Mejora: Rapid Eggs', desc: 'Dispara más rápido y más fuerte', apply: () => { 
        let w = player.weapons.find(w => w.name === "Rapid Eggs");
        if(w) w.level++; 
    }},
    { id: 'dark_energy', title: 'Aura Oscura', desc: 'Añade un campo de daño constante', apply: () => {
        let w = player.weapons.find(w => w.name === "Dark Energy");
        if(w) w.level++; else player.weapons.push(new DarkEnergyWeapon(player));
    }},
    { id: 'speed', title: 'Botas Ligeras', desc: 'Velocidad de movimiento +15%', apply: () => player.speed *= 1.15 }
];

function triggerDraft() {
    currentState = GAME_STATE.LEVEL_UP;
    document.getElementById('level-up-screen').classList.remove('hidden');
    
    // Elegir 3 opciones aleatorias
    let shuffled = [...draftOptionsDatabase].sort(() => 0.5 - Math.random());
    let choices = shuffled.slice(0, 3);
    
    const container = document.getElementById('draft-options');
    container.innerHTML = '';
    
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'glass-panel p-6 rounded-xl hover:bg-gray-700/80 transition-colors text-left border-2 border-transparent hover:border-yellow-400 group cursor-pointer';
        btn.innerHTML = `
            <h3 class="text-2xl font-bold text-white group-hover:text-yellow-400">${choice.title}</h3>
            <p class="text-gray-400 mt-2">${choice.desc}</p>
        `;
        btn.onclick = () => {
            choice.apply();
            updateHUD();
            document.getElementById('level-up-screen').classList.add('hidden');
            currentState = GAME_STATE.PLAYING;
            lastTime = performance.now(); // Reset delta
        };
        container.appendChild(btn);
    });
}

// --- BUCLE PRINCIPAL ---
function initGame() {
    player = new Player();
    gameTimer = 0;
    spawnTimer = 0;
    
    // Limpiar entidades
    enemies.forEach(e => { if(e.active) enemyPool.release(e); e.active = false; });
    projectiles.forEach(p => { if(p.active) projectilePool.release(p); p.active = false; });
    xpOrbs.forEach(o => { if(o.active) xpPool.release(o); o.active = false; });
    floatingTexts.forEach(t => { if(t.active) textPool.release(t); t.active = false; });
    
    enemies.length = 0;
    projectiles.length = 0;
    xpOrbs.length = 0;
    floatingTexts.length = 0;

    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    updateHUD();
    currentState = GAME_STATE.PLAYING;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function formatTime(secs) {
    let m = Math.floor(secs / 60);
    let s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateHUD() {
    document.getElementById('ui-level').innerText = player.level;
    document.getElementById('ui-hp').innerText = Math.max(0, Math.floor(player.hp));
    document.getElementById('ui-max-hp').innerText = player.maxHp;
    document.getElementById('ui-xp-bar').style.width = `${(player.xp / player.maxXp) * 100}%`;
    document.getElementById('ui-time').innerText = formatTime(gameTimer);
}

function gameOver() {
    currentState = GAME_STATE.GAME_OVER;
    const pointsEarned = calculatePoints(player.level);
    totalPoints += pointsEarned;
    
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('go-time').innerText = formatTime(gameTimer);
    document.getElementById('go-level').innerText = player.level;
    document.getElementById('go-points').innerText = `+${pointsEarned} (Total: ${totalPoints})`;
}

function cleanPools() {
    // Filtrar inactivos y devolver al pool (Evita Garbage Collection masivo)
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!enemies[i].active) {
            enemyPool.release(enemies[i]);
            enemies.splice(i, 1);
        }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
        if (!projectiles[i].active) {
            projectilePool.release(projectiles[i]);
            projectiles.splice(i, 1);
        }
    }
    for (let i = xpOrbs.length - 1; i >= 0; i--) {
        if (!xpOrbs[i].active) {
            xpPool.release(xpOrbs[i]);
            xpOrbs.splice(i, 1);
        }
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        if (!floatingTexts[i].active) {
            textPool.release(floatingTexts[i]);
            floatingTexts.splice(i, 1);
        }
    }
}

function gameLoop(timestamp) {
    if (currentState !== GAME_STATE.PLAYING) {
        lastTime = timestamp;
        if (currentState === GAME_STATE.GAME_OVER || currentState === GAME_STATE.LEVEL_UP) {
            requestAnimationFrame(gameLoop);
        }
        return;
    }

    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Limitar delta time
    lastTime = timestamp;
    gameTimer += dt;

    if (Math.floor(gameTimer) > Math.floor(gameTimer - dt)) updateHUD();

    // 1. UPDATE
    player.update(dt);
    updateWaveSpawner(dt);

    // Llenar Spatial Grid con enemigos activos
    enemyGrid.clear();
    for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].active) {
            enemies[i].update(dt, player.x, player.y);
            enemyGrid.insert(enemies[i]);
        }
    }

    // Update Proyectiles y Colisiones
    for (let i = 0; i < projectiles.length; i++) {
        let p = projectiles[i];
        if (!p.active) continue;
        p.update(dt);
        
        // Colisión Proyectil-Enemigo usando Spatial Grid para eficiencia
        const nearbyEnemies = enemyGrid.getNearby(p.x, p.y, p.radius + 20);
        for (let e of nearbyEnemies) {
            if (!e.active || p.hitTargets.has(e)) continue;
            let dSq = distSq(p.x, p.y, e.x, e.y);
            let rSum = p.radius + e.radius;
            if (dSq < rSum * rSum) {
                p.hitTargets.add(e);
                let isDead = e.takeDamage(p.damage, p.isCrit, p.vx, p.vy);
                p.pierce--;
                if (p.pierce <= 0) {
                    p.active = false;
                    break; // Proyectil destruido
                }
            }
        }
    }

    // Colisión Jugador-Enemigo & Recolección XP
    const nearbyToPlayer = enemyGrid.getNearby(player.x, player.y, player.radius + 30);
    for (let e of nearbyToPlayer) {
        if (!e.active) continue;
        let dSq = distSq(player.x, player.y, e.x, e.y);
        let rSum = player.radius + e.radius;
        if (dSq < rSum * rSum) {
            player.takeDamage(e.damage * dt); // Daño continuo por tocar
        }
    }

    for (let i = 0; i < xpOrbs.length; i++) {
        let orb = xpOrbs[i];
        if (!orb.active) continue;
        
        let dx = player.x - orb.x;
        let dy = player.y - orb.y;
        let dSq = dx*dx + dy*dy;
        
        // Magnetismo ligero
        let magRange = 80;
        if (dSq < magRange * magRange) {
            let dist = Math.sqrt(dSq);
            orb.x += (dx/dist) * 300 * dt;
            orb.y += (dy/dist) * 300 * dt;
        }

        // Recolección
        if (dSq < (player.radius + orb.radius)**2) {
            player.addXp(orb.value);
            orb.active = false;
        }
    }

    floatingTexts.forEach(ft => { if(ft.active) ft.update(dt); });

    cleanPools(); // Limpiar inactivos al final del frame

    // 2. RENDER
    // Calculamos cámara para centrar al jugador
    const camX = player.x - width / 2;
    const camY = player.y - height / 2;

    // Fondo: Dibujar grilla para simular movimiento
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, width, height);
    
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    const gridSize = 100;
    const startX = -(camX % gridSize);
    const startY = -(camY % gridSize);
    ctx.beginPath();
    for (let x = startX; x < width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
    for (let y = startY; y < height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
    ctx.stroke();

    // Dibujar entidades
    xpOrbs.forEach(o => { if(o.active) o.draw(ctx, camX, camY); });
    enemies.forEach(e => { if(e.active) e.draw(ctx, camX, camY); });
    player.draw(ctx, camX, camY);
    projectiles.forEach(p => { if(p.active) p.draw(ctx, camX, camY); });
    floatingTexts.forEach(ft => { if(ft.active) ft.draw(ctx, camX, camY); });

    requestAnimationFrame(gameLoop);
}

// --- LÓGICA DE LA TIENDA ---
function openShop() {
    currentState = GAME_STATE.SHOP;
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('shop-screen').classList.remove('hidden');
    renderShop();
}

function closeShop() {
    currentState = GAME_STATE.MENU;
    document.getElementById('shop-screen').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
}

function renderShop() {
    document.getElementById('shop-points').innerText = totalPoints;
    const container = document.getElementById('shop-items');
    container.innerHTML = '';
    
    skinsDB.forEach(skin => {
        const isUnlocked = unlockedSkins.includes(skin.id);
        const isEquipped = currentSkinId === skin.id;
        
        const btn = document.createElement('button');
        btn.className = `glass-panel p-4 rounded-xl flex flex-col items-center transition-transform transform hover:scale-105 border-2 ${isEquipped ? 'border-green-400 bg-green-900/30' : 'border-transparent hover:border-gray-400'}`;
        
        let btnAction = '';
        if (isEquipped) {
            btnAction = `<span class="mt-4 px-4 py-2 bg-green-600 text-white rounded font-bold w-full text-center">Equipado</span>`;
        } else if (isUnlocked) {
            btnAction = `<span class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold w-full text-center">Equipar</span>`;
        } else {
            const canAfford = totalPoints >= skin.price;
            btnAction = `<span class="mt-4 px-4 py-2 ${canAfford ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-gray-700 text-gray-400'} rounded font-bold w-full text-center">${skin.price} pts</span>`;
        }

        btn.innerHTML = `
            <div class="w-16 h-16 rounded-full mb-4 shadow-lg border-2 border-white/20" style="background-color: ${skin.color}"></div>
            <h3 class="text-md font-bold text-white mb-2">${skin.name}</h3>
            ${btnAction}
        `;

        btn.onclick = () => {
            if (isUnlocked) {
                currentSkinId = skin.id;
                renderShop();
            } else if (totalPoints >= skin.price) {
                totalPoints -= skin.price;
                unlockedSkins.push(skin.id);
                currentSkinId = skin.id;
                renderShop();
            }
        };

        container.appendChild(btn);
    });
}

// Inicializar eventos de botones UI
document.getElementById('btn-start').addEventListener('click', initGame);
document.getElementById('btn-restart').addEventListener('click', initGame);
document.getElementById('btn-to-menu').addEventListener('click', () => {
    document.getElementById('game-over-screen').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
    currentState = GAME_STATE.MENU;
});
document.getElementById('btn-shop').addEventListener('click', openShop);
document.getElementById('btn-to-shop-from-go').addEventListener('click', openShop);
document.getElementById('btn-close-shop').addEventListener('click', closeShop);

</script>
