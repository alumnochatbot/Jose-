<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Clone - HTML5</title>
    <!-- Importar Matter.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .controls-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
            align-items: center;
        }
        #score-board {
            font-size: 20px; font-weight: bold; color: #333;
            background: rgba(255,255,255,0.85);
            padding: 10px 15px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #level-select {
            padding: 10px; font-size: 16px; font-weight: bold;
            border-radius: 10px; border: 2px solid #ff4757;
            background: white; color: #333; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #btn-restart {
            pointer-events: auto;
            padding: 10px 15px; font-size: 16px; font-weight: bold;
            color: white; background-color: #ff4757;
            border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }
        #btn-restart:hover { background-color: #ff6b81; transform: scale(1.05); }
        #btn-restart:active { transform: scale(0.95); }
        
        /* Contenedor del Mensaje de Estado */
        #message-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none; text-align: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 3px solid #fff;
            max-width: 90%;
            box-sizing: border-box;
        }
        #message-title {
            font-size: 40px; font-weight: bold; color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        #btn-next-level {
            padding: 12px 25px; font-size: 18px; font-weight: bold;
            color: white; background-color: #2ed573;
            border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }
        #btn-next-level:hover { background-color: #26af5f; transform: scale(1.05); }
        #btn-next-level:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="header">
            <div id="score-board">Nivel <span id="current-level-num">1</span> | Puntuación: <span id="score">0</span></div>
            <div class="controls-group">
                <select id="level-select" onchange="selectLevel(this.value)">
                    <option value="1">Nivel 1: El Fuerte del Bosque</option>
                    <option value="2">Nivel 2: Torres Gemelas de Piedra</option>
                    <option value="3">Nivel 3: El Castillo de TNT del Rey</option>
                </select>
                <button id="btn-restart" onclick="initGame()">🔄 Reiniciar</button>
            </div>
        </div>
        
        <div id="message-container">
            <div id="message-title">¡Nivel Completado!</div>
            <button id="btn-next-level" onclick="nextLevel()">Siguiente Nivel ➡️</button>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script>
        const Engine = Matter.Engine, Render = Matter.Render, Runner = Matter.Runner,
              World = Matter.World, Bodies = Matter.Bodies, Body = Matter.Body,
              Constraint = Matter.Constraint, Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint, Events = Matter.Events,
              Vector = Matter.Vector, Composite = Matter.Composite;

        let engine, world, canvas, ctx, width, height;
        let bird, sling, pigs = [], blocks = [], ground, mouseConstraint;
        let slingPos = { x: 200, y: 0 };
        let isFired = false, score = 0, gameState = 'PLAYING';
        let birdQueue = [], currentBirdType = '', isAbilityUsed = false;
        let activeExplosions = []; 
        let currentLevel = 1;
        const totalLevels = 3;

        const scoreEl = document.getElementById('score');
        const levelNumEl = document.getElementById('current-level-num');
        const levelSelect = document.getElementById('level-select');
        const msgContainer = document.getElementById('message-container');
        const msgTitle = document.getElementById('message-title');
        const btnNextLevel = document.getElementById('btn-next-level');

        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d', { alpha: false });
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            engine = Engine.create();
            world = engine.world;
            engine.gravity.y = 1;
            const mouse = Mouse.create(canvas);
            mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.1, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            mouseConstraint.mouse.element.removeEventListener("mousewheel", mouseConstraint.mouse.mousewheel);
            mouseConstraint.mouse.element.removeEventListener("DOMMouseScroll", mouseConstraint.mouse.mousewheel);
            initGame();
            ['mousedown', 'touchstart'].forEach(evt => {
                window.addEventListener(evt, () => {
                    if (isFired && currentBirdType === 'yellow' && !isAbilityUsed && bird && !bird.isDead) {
                        isAbilityUsed = true;
                        const currentSpeed = Vector.magnitude(bird.velocity);
                        if (currentSpeed > 0.5) {
                            const direction = Vector.normalise(bird.velocity);
                            Body.setVelocity(bird, Vector.mult(direction, Math.max(currentSpeed * 1.8, 20)));
                        }
                    }
                });
            });
            requestAnimationFrame(gameLoop);
            setupEvents();
        }

        function resizeCanvas() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            slingPos.y = height - 150;
        }

        function initGame() {
            World.clear(world); Engine.clear(engine);
            pigs = []; blocks = []; isFired = false; score = 0;
            updateScore(0); gameState = 'PLAYING';
            msgContainer.style.display = 'none';
            isAbilityUsed = false; sling = null;
            activeExplosions = [];
            levelNumEl.innerText = currentLevel;
            levelSelect.value = currentLevel;
            
            if (currentLevel === 1) {
                birdQueue = ['red', 'yellow', 'red'];
            } else if (currentLevel === 2) {
                birdQueue = ['yellow', 'black', 'red'];
            } else {
                birdQueue = ['black', 'yellow', 'black', 'red'];
            }

            Composite.add(world, mouseConstraint);
            ground = Bodies.rectangle(width / 2, height - 20, width * 2, 40, {
                isStatic: true, label: 'ground', friction: 0.8
            });
            Composite.add(world, ground);
            loadNextBird();
            buildLevel();
        }

        function selectLevel(val) {
            currentLevel = parseInt(val);
            initGame();
        }

        function nextLevel() {
            if (currentLevel < totalLevels) {
                currentLevel++;
                initGame();
            } else {
                currentLevel = 1;
                initGame();
            }
        }

        function loadNextBird() {
            if (birdQueue.length === 0) return;
            currentBirdType = birdQueue.shift();
            isFired = false; isAbilityUsed = false;
            let birdOpts = { restitution: 0.4, frictionAir: 0.01, label: 'bird', birdType: currentBirdType };
            if (currentBirdType === 'yellow') birdOpts.density = 0.002;
            else if (currentBirdType === 'black') birdOpts.density = 0.01;
            else birdOpts.density = 0.005;
            bird = Bodies.circle(slingPos.x, slingPos.y, 20, birdOpts);
            if (sling) World.remove(world, sling);
            sling = Constraint.create({
                pointA: { x: slingPos.x, y: slingPos.y },
                bodyB: bird, stiffness: 0.05, damping: 0.01, length: 0
            });
            Composite.add(world, [bird, sling]);
        }

        function buildLevel() {
            const baseX = width * 0.7, baseY = height - 40;
            
            const woodOpts = { restitution: 0.1, density: 0.002, friction: 0.5, label: 'wood' };
            const stoneOpts = { restitution: 0.05, density: 0.006, friction: 0.6, label: 'stone' };
            const iceOpts = { restitution: 0.15, density: 0.0012, friction: 0.15, label: 'ice' };
            const tntOpts = { restitution: 0.1, density: 0.0015, friction: 0.4, label: 'tnt' };
            const pigOpts = { restitution: 0.35, density: 0.001, friction: 0.4, label: 'pig' };
            const bonusOpts = { restitution: 0.6, density: 0.0005, friction: 0.2, label: 'bonus' };

            if (currentLevel === 1) {
                blocks.push(Bodies.rectangle(baseX - 60, baseY - 30, 25, 60, woodOpts)); 
                blocks.push(Bodies.rectangle(baseX + 60, baseY - 30, 25, 60, woodOpts)); 
                blocks.push(Bodies.rectangle(baseX, baseY - 70, 160, 20, woodOpts)); 
                
                pigs.push(Bodies.circle(baseX, baseY - 20, 18, { ...pigOpts, pigType: 'normal' }));
                
                blocks.push(Bodies.rectangle(baseX - 40, baseY - 100, 25, 40, iceOpts));
                blocks.push(Bodies.rectangle(baseX + 40, baseY - 100, 25, 40, iceOpts));
                blocks.push(Bodies.rectangle(baseX, baseY - 130, 120, 15, iceOpts));
                
                pigs.push(Bodies.circle(baseX, baseY - 100, 18, { ...pigOpts, pigType: 'normal' }));
                blocks.push(Bodies.circle(baseX + 130, baseY - 80, 15, { ...bonusOpts, bonusType: 'duck' }));

            } else if (currentLevel === 2) {
                blocks.push(Bodies.rectangle(baseX - 80, baseY - 35, 30, 70, stoneOpts));
                blocks.push(Bodies.rectangle(baseX - 80, baseY - 105, 30, 70, stoneOpts));
                blocks.push(Bodies.rectangle(baseX - 80, baseY - 150, 80, 15, stoneOpts)); 
                
                blocks.push(Bodies.rectangle(baseX + 80, baseY - 35, 30, 70, stoneOpts));
                blocks.push(Bodies.rectangle(baseX + 80, baseY - 105, 30, 70, stoneOpts));
                blocks.push(Bodies.rectangle(baseX + 80, baseY - 150, 80, 15, stoneOpts)); 

                blocks.push(Bodies.rectangle(baseX, baseY - 30, 20, 60, woodOpts)); 
                blocks.push(Bodies.rectangle(baseX, baseY - 70, 110, 15, woodOpts)); 
                
                blocks.push(Bodies.rectangle(baseX, baseY - 100, 35, 35, tntOpts));

                pigs.push(Bodies.circle(baseX - 80, baseY - 180, 20, { ...pigOpts, pigType: 'cowboy' })); 
                pigs.push(Bodies.circle(baseX + 80, baseY - 180, 20, { ...pigOpts, pigType: 'cowboy' })); 
                pigs.push(Bodies.circle(baseX, baseY - 20, 18, { ...pigOpts, pigType: 'normal' }));       

                blocks.push(Bodies.circle(baseX - 160, baseY - 100, 18, { ...bonusOpts, bonusType: 'balloon' }));
                blocks.push(Bodies.circle(baseX + 160, baseY - 100, 18, { ...bonusOpts, bonusType: 'balloon' }));

            } else if (currentLevel === 3) {
                blocks.push(Bodies.rectangle(baseX - 90, baseY - 35, 25, 70, stoneOpts)); 
                blocks.push(Bodies.rectangle(baseX + 90, baseY - 35, 25, 70, stoneOpts)); 
                blocks.push(Bodies.circle(baseX - 125, baseY - 20, 20, { ...stoneOpts, label: 'boulder' }));
                blocks.push(Bodies.circle(baseX + 125, baseY - 20, 20, { ...stoneOpts, label: 'boulder' }));
                
                pigs.push(Bodies.circle(baseX, baseY - 20, 22, { ...pigOpts, pigType: 'helmet' }));
                blocks.push(Bodies.rectangle(baseX, baseY - 75, 230, 15, stoneOpts));

                const triLeft = Bodies.polygon(baseX - 80, baseY - 110, 3, 25, { ...woodOpts, label: 'wood_tri' });
                const triRight = Bodies.polygon(baseX + 80, baseY - 110, 3, 25, { ...woodOpts, label: 'wood_tri' });
                Body.setAngle(triLeft, Math.PI / 6);
                Body.setAngle(triRight, -Math.PI / 6);
                blocks.push(triLeft, triRight);

                blocks.push(Bodies.rectangle(baseX - 45, baseY - 110, 20, 50, iceOpts));
                blocks.push(Bodies.rectangle(baseX + 45, baseY - 110, 20, 50, iceOpts));
                
                blocks.push(Bodies.rectangle(baseX - 15, baseY - 100, 30, 30, tntOpts));
                blocks.push(Bodies.rectangle(baseX + 15, baseY - 100, 30, 30, tntOpts));

                pigs.push(Bodies.circle(baseX - 55, baseY - 150, 18, { ...pigOpts, pigType: 'cowboy' }));
                blocks.push(Bodies.rectangle(baseX, baseY - 145, 140, 15, woodOpts));

                blocks.push(Bodies.rectangle(baseX - 35, baseY - 175, 15, 45, iceOpts));
                blocks.push(Bodies.rectangle(baseX + 35, baseY - 175, 15, 45, iceOpts));

                const stoneTriL = Bodies.polygon(baseX - 60, baseY - 175, 3, 20, { ...stoneOpts, label: 'stone_tri' });
                const stoneTriR = Bodies.polygon(baseX + 60, baseY - 175, 3, 20, { ...stoneOpts, label: 'stone_tri' });
                blocks.push(stoneTriL, stoneTriR);

                pigs.push(Bodies.circle(baseX, baseY - 180, 26, { ...pigOpts, pigType: 'king' }));
                blocks.push(Bodies.rectangle(baseX, baseY - 205, 95, 15, iceOpts));

                blocks.push(Bodies.circle(baseX - 180, baseY - 130, 18, { ...bonusOpts, bonusType: 'balloon' }));
                blocks.push(Bodies.circle(baseX + 180, baseY - 130, 18, { ...bonusOpts, bonusType: 'balloon' }));
                blocks.push(Bodies.circle(baseX - 120, baseY - 110, 15, { ...bonusOpts, bonusType: 'watermelon' }));
                blocks.push(Bodies.circle(baseX + 120, baseY - 110, 15, { ...bonusOpts, bonusType: 'duck' }));
            }

            Composite.add(world, [...blocks, ...pigs]);
        }

        function setupEvents() {
            Events.on(mouseConstraint, 'enddrag', function(event) {
                if (event.body === bird && !isFired) {
                    if (bird.position.x < slingPos.x + 20) {
                        isFired = true;
                        setTimeout(() => { if (sling) sling.bodyB = null; }, 20);
                    }
                }
            });
            
            Events.on(engine, 'collisionStart', function(event) {
                event.pairs.forEach(pair => {
                    const { bodyA, bodyB } = pair;
                    const isBirdA = bodyA.label === 'bird', isBirdB = bodyB.label === 'bird';
                    const birdBody = isBirdA ? bodyA : (isBirdB ? bodyB : null);
                    
                    if (birdBody && birdBody.birdType === 'black' && isFired && !isAbilityUsed) {
                        const other = isBirdA ? bodyB : bodyA;
                        if (other.label !== 'ground' || Vector.magnitude(birdBody.velocity) > 2) {
                            isAbilityUsed = true;
                            explode(birdBody.position, 160, 0.0008);
                            birdBody.isDead = true;
                            World.remove(world, birdBody);
                        }
                    }

                    const isTNTA = bodyA.label === 'tnt', isTNTB = bodyB.label === 'tnt';
                    if (isTNTA || isTNTB) {
                        const tntBody = isTNTA ? bodyA : bodyB;
                        const impactVelocity = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
                        if (impactVelocity > 2.0 || bodyA.label === 'bird' || bodyB.label === 'bird') {
                            tntBody.isDead = true;
                        }
                    }

                    const isPigA = bodyA.label === 'pig', isPigB = bodyB.label === 'pig';
                    if (isPigA || isPigB) {
                        const pig = isPigA ? bodyA : bodyB;
                        const other = isPigA ? bodyB : bodyA;
                        const relativeVelocity = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
                        
                        let threshold = 3.0;
                        if (pig.pigType === 'helmet') threshold = 6.0;
                        if (pig.pigType === 'king') threshold = 5.0;

                        if (relativeVelocity > threshold || other.label === 'bird' || other.label === 'tnt') {
                            pig.isDead = true;
                        }
                    }

                    const isBonusA = bodyA.label === 'bonus', isBonusB = bodyB.label === 'bonus';
                    if (isBonusA || isBonusB) {
                        const bonus = isBonusA ? bodyA : bodyB;
                        const relVel = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
                        if (relVel > 1.5 || bodyA.label === 'bird' || bodyB.label === 'bird') {
                            bonus.isDead = true;
                        }
                    }
                });
            });
        }

        function explode(position, radius = 180, forceFactor = 0.0007) {
            activeExplosions.push({
                x: position.x,
                y: position.y,
                radius: radius,
                timer: 0,
                maxTimer: 15
            });

            Composite.allBodies(world).forEach(b => {
                if (b.isStatic || b.label === 'bird') return;
                const distance = Vector.magnitude(Vector.sub(b.position, position));
                if (distance < radius) {
                    const forceDirection = Vector.normalise(Vector.sub(b.position, position));
                    const forceMagnitude = (radius - distance) * forceFactor * b.mass;
                    Body.applyForce(b, b.position, Vector.mult(forceDirection, forceMagnitude));
                    
                    if (b.label === 'tnt' && !b.isDead) {
                        b.isDead = true;
                    }
                    if (b.label === 'pig') {
                        b.isDead = true; 
                    }
                    if (b.label === 'bonus') {
                        b.isDead = true;
                    }
                }
            });
        }

        function updateScore(points) { score += points; scoreEl.innerText = score; }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (gameState !== 'PLAYING') return;
            
            Engine.update(engine, 1000 / 60);

            blocks.forEach(b => {
                if (b.label === 'bonus' && b.bonusType === 'balloon') {
                    Body.applyForce(b, b.position, { x: 0, y: -0.00015 * b.mass });
                }
            });

            for (let i = blocks.length - 1; i >= 0; i--) {
                if (blocks[i].isDead) {
                    if (blocks[i].label === 'tnt') {
                        explode(blocks[i].position, 200, 0.0009);
                        updateScore(1000);
                    } else if (blocks[i].label === 'bonus') {
                        updateScore(250);
                    }
                    World.remove(world, blocks[i]);
                    blocks.splice(i, 1);
                }
            }

            for (let i = pigs.length - 1; i >= 0; i--) {
                if (pigs[i].isDead) {
                    World.remove(world, pigs[i]);
                    let bonusPoints = 500;
                    if (pigs[i].pigType === 'king') bonusPoints = 2000;
                    if (pigs[i].pigType === 'helmet') bonusPoints = 1000;
                    pigs.splice(i, 1);
                    updateScore(bonusPoints);
                }
            }

            if (pigs.length === 0 && gameState === 'PLAYING') {
                gameState = 'WON';
                msgContainer.style.display = 'block';
                if (currentLevel < totalLevels) {
                    msgTitle.innerText = "¡Nivel Completado!";
                    msgTitle.style.color = "#2ed573";
                    btnNextLevel.innerText = "Siguiente Nivel ➡️";
                } else {
                    msgTitle.innerText = "🏆 ¡VICTORIA TOTAL! 🏆";
                    msgTitle.style.color = "#ffbe76";
                    btnNextLevel.innerText = "Volver a Jugar 🔄";
                }
            }

            if (isFired && pigs.length > 0 && bird) {
                const speed = Vector.magnitude(bird.velocity);
                const outOfBounds = bird.position.x > width || bird.position.x < 0 || bird.position.y > height;
                if (outOfBounds || (speed < 0.2 && bird.position.y > height - 60) || bird.isDead) {
                    if (!bird.deathTimer) bird.deathTimer = 1;
                    bird.deathTimer++;
                    if (bird.deathTimer > 80) {
                        World.remove(world, bird); bird = null;
                        if (birdQueue.length > 0) loadNextBird();
                        else {
                            gameState = 'LOST';
                            msgContainer.style.display = 'block';
                            msgTitle.innerText = "¡Nivel Fallado!";
                            msgTitle.style.color = "#ff4757";
                            btnNextLevel.innerText = "Reintentar Nivel 🔄";
                        }
                    }
                }
            }
            draw();
        }

        // --- PROCEDURAL HIGH-FIDELITY VECTOR GRAPHICS ---

        function drawProceduralSling() {
            const bottomY = height - 20;
            ctx.save();
            ctx.strokeStyle = '#6e473b'; 
            ctx.fillStyle = '#8B5A2B'; 
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Dibujar estructura Y de madera real
            ctx.beginPath();
            ctx.moveTo(slingPos.x, bottomY);
            ctx.lineTo(slingPos.x, slingPos.y + 40);
            ctx.lineTo(slingPos.x - 20, slingPos.y);
            ctx.moveTo(slingPos.x, slingPos.y + 40);
            ctx.lineTo(slingPos.x + 20, slingPos.y);
            ctx.stroke();

            // Dibujar detalles de vetas de madera en el poste de la resortera
            ctx.strokeStyle = '#54352b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(slingPos.x - 2, bottomY);
            ctx.lineTo(slingPos.x - 2, slingPos.y + 45);
            ctx.stroke();

            // Dibujar ligas elásticas unidas al pájaro si está cargado
            if (!isFired && sling && sling.bodyB) {
                ctx.strokeStyle = '#cd6133';
                ctx.lineWidth = 7;
                
                // Liga trasera
                ctx.beginPath();
                ctx.moveTo(slingPos.x - 20, slingPos.y + 5);
                ctx.lineTo(bird.position.x - 10, bird.position.y);
                ctx.stroke();

                // Liga delantera
                ctx.beginPath();
                ctx.moveTo(slingPos.x + 20, slingPos.y + 5);
                ctx.lineTo(bird.position.x + 10, bird.position.y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawProceduralBird(type, radius) {
            ctx.save();
            if (type === 'red') {
                // Cuerpo Principal Rojo
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

                // Vientre de color crema/blanco inferior
                ctx.fillStyle = '#f5f6fa';
                ctx.beginPath();
                ctx.arc(0, radius * 0.35, radius * 0.8, Math.PI * 0.95, Math.PI * 2.05);
                ctx.closePath(); ctx.fill();

                // Ojos
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-radius * 0.3, -radius * 0.15, radius * 0.28, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.15, -radius * 0.15, radius * 0.28, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(-radius * 0.22, -radius * 0.12, radius * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.22, -radius * 0.12, radius * 0.08, 0, Math.PI * 2); ctx.fill();

                // Cejas Rojas/Negras muy enfadadas
                ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = radius * 0.14; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-radius * 0.65, -radius * 0.45); ctx.lineTo(radius * 0.1, -radius * 0.28); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(radius * 0.55, -radius * 0.45); ctx.lineTo(-radius * 0.1, -radius * 0.28); ctx.stroke();

                // Pico de color naranja con sombreado
                ctx.fillStyle = '#f39c12';
                ctx.beginPath(); ctx.moveTo(-radius * 0.25, -radius * 0.02); ctx.lineTo(radius * 0.3, radius * 0.08); ctx.lineTo(-radius * 0.25, radius * 0.28); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#e67e22';
                ctx.beginPath(); ctx.moveTo(-radius * 0.25, radius * 0.08); ctx.lineTo(radius * 0.3, radius * 0.08); ctx.lineTo(-radius * 0.25, radius * 0.28); ctx.closePath(); ctx.fill();

                // Cresta/Pluma trasera
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(-radius * 0.8, -radius * 0.4, radius * 0.3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-radius * 0.9, -radius * 0.1, radius * 0.2, 0, Math.PI * 2); ctx.fill();

            } else if (type === 'yellow') {
                // Pájaro Amarillo Triangular (Chuck)
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.moveTo(0, -radius * 1.2);
                ctx.lineTo(radius * 1.1, radius * 0.9);
                ctx.lineTo(-radius * 1.1, radius * 0.9);
                ctx.closePath(); ctx.fill();

                // Cresta/Pelo Negro superior
                ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = radius * 0.18; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-radius * 0.1, -radius * 1.1); ctx.lineTo(-radius * 0.6, -radius * 1.6); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(radius * 0.05, -radius * 1.1); ctx.lineTo(-radius * 0.25, -radius * 1.7); ctx.stroke();

                // Vientre de color crema/blanco inferior
                ctx.fillStyle = '#f5f6fa';
                ctx.beginPath();
                ctx.moveTo(-radius * 0.9, radius * 0.7);
                ctx.quadraticCurveTo(0, radius * 0.2, radius * 0.9, radius * 0.7);
                ctx.lineTo(radius * 1.1, radius * 0.9);
                ctx.lineTo(-radius * 1.1, radius * 0.9);
                ctx.closePath(); ctx.fill();

                // Ojos
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-radius * 0.25, 0, radius * 0.24, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.2, 0, radius * 0.24, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(-radius * 0.18, 0, radius * 0.07, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.22, 0, radius * 0.07, 0, Math.PI * 2); ctx.fill();

                // Cejas marrón/rojizo oscuras
                ctx.strokeStyle = '#962d22'; ctx.lineWidth = radius * 0.12; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-radius * 0.55, -radius * 0.3); ctx.lineTo(radius * 0.05, -radius * 0.1); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(radius * 0.5, -radius * 0.3); ctx.lineTo(-radius * 0.05, -radius * 0.1); ctx.stroke();

                // Pico de color naranja
                ctx.fillStyle = '#e67e22';
                ctx.beginPath(); ctx.moveTo(-radius * 0.2, 0.05); ctx.lineTo(radius * 0.5, radius * 0.25); ctx.lineTo(-radius * 0.2, radius * 0.45); ctx.closePath(); ctx.fill();

            } else if (type === 'black') {
                // Pájaro Bomba Negro
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

                // Frente de color grisáceo
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath(); ctx.arc(0, -radius * 0.5, radius * 0.4, 0, Math.PI * 2); ctx.fill();

                // Detalle del fusible superior (mechón de pelo con punta naranja/amarilla)
                ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = radius * 0.2;
                ctx.beginPath(); ctx.moveTo(0, -radius * 0.9); ctx.lineTo(0, -radius * 1.3); ctx.stroke();
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.arc(0, -radius * 1.35, radius * 0.15, 0, Math.PI * 2); ctx.fill();

                // Puntos decorativos de mejillas
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath(); ctx.arc(-radius * 0.5, radius * 0.2, radius * 0.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.5, radius * 0.2, radius * 0.2, 0, Math.PI * 2); ctx.fill();

                // Ojos furiosos con borde rojo
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(-radius * 0.26, -radius * 0.05, radius * 0.26, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.26, -radius * 0.05, radius * 0.26, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-radius * 0.26, -radius * 0.05, radius * 0.22, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.26, -radius * 0.05, radius * 0.22, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(-radius * 0.18, -radius * 0.05, radius * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.22, -radius * 0.05, radius * 0.08, 0, Math.PI * 2); ctx.fill();

                // Cejas naranjas prominentes
                ctx.strokeStyle = '#e67e22'; ctx.lineWidth = radius * 0.15; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-radius * 0.6, -radius * 0.35); ctx.lineTo(0, -radius * 0.15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(radius * 0.6, -radius * 0.35); ctx.lineTo(0, -radius * 0.15); ctx.stroke();

                // Pico de color amarillo
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath(); ctx.moveTo(-radius * 0.15, radius * 0.1); ctx.lineTo(radius * 0.25, radius * 0.2); ctx.lineTo(-radius * 0.15, radius * 0.35); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawProceduralPig(pigType, radius) {
            ctx.save();
            // Cuerpo Verde de Cerdo
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

            // Orejas de cerdito
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath(); ctx.arc(-radius * 0.8, -radius * 0.7, radius * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(radius * 0.8, -radius * 0.7, radius * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#27ae60';
            ctx.beginPath(); ctx.arc(-radius * 0.8, -radius * 0.7, radius * 0.15, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(radius * 0.8, -radius * 0.7, radius * 0.15, 0, Math.PI * 2); ctx.fill();

            // Ojos con pupila cruzada o asombrada
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-radius * 0.35, -radius * 0.2, radius * 0.25, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(radius * 0.35, -radius * 0.2, radius * 0.25, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(-radius * 0.32, -radius * 0.2, radius * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(radius * 0.38, -radius * 0.2, radius * 0.08, 0, Math.PI * 2); ctx.fill();

            // Hocico Ovalado
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.ellipse(0, radius * 0.15, radius * 0.45, radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            // Fosas nasales oscuras
            ctx.fillStyle = '#145d2f';
            ctx.beginPath(); ctx.arc(-radius * 0.15, radius * 0.15, radius * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(radius * 0.15, radius * 0.15, radius * 0.08, 0, Math.PI * 2); ctx.fill();

            // Cejas sutiles asustadas
            ctx.strokeStyle = '#1e824c'; ctx.lineWidth = radius * 0.08; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-radius * 0.6, -radius * 0.55); ctx.lineTo(-radius * 0.15, -radius * 0.45); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(radius * 0.6, -radius * 0.55); ctx.lineTo(radius * 0.15, -radius * 0.45); ctx.stroke();

            // --- ACCESORIOS DE CERDOS DE ACUERDO A SU CLASE ---
            if (pigType === 'helmet') {
                // Casco Militar de Piedra/Hierro Verde Militar en la mitad superior
                ctx.fillStyle = '#5c6b73';
                ctx.strokeStyle = '#2f3e46';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, -radius * 0.15, radius * 1.1, Math.PI * 1.05, Math.PI * 1.95);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Detalles del remache y brillo del casco
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(radius * 0.5, -radius * 0.8, radius * 0.08, 0, Math.PI * 2); ctx.fill();

            } else if (pigType === 'cowboy') {
                // Sombrero de Vaquero Marrón de ala ancha
                ctx.fillStyle = '#8a5a36';
                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 2;
                
                // Ala del sombrero (elipse en la frente)
                ctx.beginPath();
                ctx.ellipse(0, -radius * 0.35, radius * 1.3, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                // Copa del sombrero
                ctx.beginPath();
                ctx.moveTo(-radius * 0.7, -radius * 0.35);
                ctx.quadraticCurveTo(-radius * 0.5, -radius * 1.2, 0, -radius * 1.15);
                ctx.quadraticCurveTo(radius * 0.5, -radius * 1.2, radius * 0.7, -radius * 0.35);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Banda negra decorativa
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.moveTo(-radius * 0.7, -radius * 0.35);
                ctx.lineTo(-radius * 0.65, -radius * 0.45);
                ctx.lineTo(radius * 0.65, -radius * 0.45);
                ctx.lineTo(radius * 0.7, -radius * 0.35);
                ctx.closePath(); ctx.fill();

            } else if (pigType === 'king') {
                // Corona Real del Rey Cerdo con joyas rojas
                ctx.fillStyle = '#f1c40f'; // Oro brillante
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(-radius * 0.7, -radius * 0.7);
                ctx.lineTo(-radius * 0.5, -radius * 1.3); // Pico Izq
                ctx.lineTo(-radius * 0.2, -radius * 0.95);
                ctx.lineTo(0, -radius * 1.4);          // Pico Central
                ctx.lineTo(radius * 0.2, -radius * 0.95);
                ctx.lineTo(radius * 0.5, -radius * 1.3);  // Pico Der
                ctx.lineTo(radius * 0.7, -radius * 0.7);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Gemas Rojas de rubí
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(-radius * 0.5, -radius * 1.25, radius * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -radius * 1.35, radius * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(radius * 0.5, -radius * 1.25, radius * 0.08, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawProceduralBlock(label, width, height) {
            ctx.save();
            if (label === 'wood' || label === 'wood_tri') {
                // Textura de Madera (Marrón Claro con Vetas y Clavos)
                ctx.fillStyle = '#d3a26a';
                ctx.strokeStyle = '#8b5a2b';
                ctx.lineWidth = 3;

                if (label === 'wood_tri') {
                    // Render de Triángulo de Madera
                    ctx.beginPath();
                    ctx.moveTo(-width / 2, height / 2);
                    ctx.lineTo(width / 2, height / 2);
                    ctx.lineTo(0, -height / 2);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    // Vetas internas del triángulo
                    ctx.strokeStyle = '#b07c4b';
                    ctx.beginPath();
                    ctx.moveTo(-width * 0.3, height * 0.35);
                    ctx.lineTo(0, -height * 0.2);
                    ctx.lineTo(width * 0.3, height * 0.35);
                    ctx.stroke();
                } else {
                    // Rectángulo de madera
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeRect(-width / 2, -height / 2, width, height);

                    // Líneas de vetas longitudinales
                    ctx.strokeStyle = '#b07c4b';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-width / 2 + 5, -height / 4);
                    ctx.lineTo(width / 2 - 5, -height / 4);
                    ctx.moveTo(-width / 2 + 5, height / 4);
                    ctx.lineTo(width / 2 - 5, height / 4);
                    ctx.stroke();

                    // Pequeños tornillos/clavos en las esquinas de las tablas
                    ctx.fillStyle = '#7f8c8d';
                    const offset = 4;
                    ctx.beginPath();
                    ctx.arc(-width / 2 + offset, -height / 2 + offset, 2, 0, Math.PI * 2);
                    ctx.arc(width / 2 - offset, -height / 2 + offset, 2, 0, Math.PI * 2);
                    ctx.arc(-width / 2 + offset, height / 2 - offset, 2, 0, Math.PI * 2);
                    ctx.arc(width / 2 - offset, height / 2 - offset, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

            } else if (label === 'stone' || label === 'stone_tri' || label === 'boulder') {
                // Textura de Piedra Rústica Agrietada
                ctx.fillStyle = '#95a5a6';
                ctx.strokeStyle = '#7f8c8d';
                ctx.lineWidth = 3;

                if (label === 'boulder') {
                    // Roca Redonda Agrietada
                    const radius = width / 2;
                    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    // Grietas físicas en la piedra
                    ctx.strokeStyle = '#626567';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-radius * 0.5, -radius * 0.3);
                    ctx.lineTo(-radius * 0.1, radius * 0.1);
                    ctx.lineTo(radius * 0.4, -radius * 0.2);
                    ctx.stroke();

                    // Sombreado interno volumétrico
                    const grad = ctx.createRadialGradient(-radius*0.2, -radius*0.2, radius*0.2, 0, 0, radius);
                    grad.addColorStop(0, 'rgba(255,255,255,0.15)');
                    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

                } else if (label === 'stone_tri') {
                    ctx.beginPath();
                    ctx.moveTo(-width / 2, height / 2);
                    ctx.lineTo(width / 2, height / 2);
                    ctx.lineTo(0, -height / 2);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    // Grietas en el triángulo de piedra
                    ctx.strokeStyle = '#626567';
                    ctx.beginPath();
                    ctx.moveTo(0, -height * 0.1);
                    ctx.lineTo(-width * 0.25, height * 0.3);
                    ctx.stroke();
                } else {
                    // Rectángulo de piedra tallada
                    ctx.fillRect(-width / 2, -height / 2, width, height);
                    ctx.strokeRect(-width / 2, -height / 2, width, height);

                    // Textura rugosa de relieve
                    ctx.strokeStyle = '#7f8c8d';
                    ctx.beginPath();
                    ctx.moveTo(-width / 2 + 10, -height / 2 + 10);
                    ctx.lineTo(width / 2 - 10, height / 2 - 10);
                    ctx.stroke();

                    ctx.strokeStyle = '#626567';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-width / 3, -height / 2);
                    ctx.lineTo(-width / 3, height / 2);
                    ctx.moveTo(width / 3, -height / 2);
                    ctx.lineTo(width / 3, height / 2);
                    ctx.stroke();
                }

            } else if (label === 'ice') {
                // Textura de Hielo Cristalino Translúcido
                ctx.fillStyle = 'rgba(173, 216, 230, 0.7)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 2;

                // Relleno base
                ctx.fillRect(-width / 2, -height / 2, width, height);
                ctx.strokeRect(-width / 2, -height / 2, width, height);

                // Brillos diagonales e internos de congelación
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-width / 2 + 3, -height / 2 + 12);
                ctx.lineTo(width / 2 - 12, height / 2 - 3);
                ctx.stroke();

                // Esquina sombreada en azul glaciar
                ctx.fillStyle = 'rgba(41, 128, 185, 0.25)';
                ctx.beginPath();
                ctx.moveTo(width / 2, -height / 2);
                ctx.lineTo(width / 2, height / 2);
                ctx.lineTo(-width / 2, height / 2);
                ctx.closePath();
                ctx.fill();

            } else if (label === 'tnt') {
                // Caja de Dinamita TNT Detallada
                ctx.fillStyle = '#c0392b'; // Rojo oscuro de caja
                ctx.strokeStyle = '#7f0000';
                ctx.lineWidth = 2.5;
                ctx.fillRect(-width / 2, -height / 2, width, height);
                ctx.strokeRect(-width / 2, -height / 2, width, height);

                // Cuerdas/Correas metálicas de sujeción (bandas amarillas)
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(-width / 2 + 2, -height / 4, width - 4, 6);
                ctx.fillRect(-width / 2 + 2, height / 4 - 6, width - 4, 6);

                // Estencil de TNT en medio
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 1;
                ctx.fillText('TNT', 0, 0);
                ctx.shadowBlur = 0; // Resetear sombra
            }
            ctx.restore();
        }

        function drawProceduralBonus(type, radius) {
            ctx.save();
            if (type === 'balloon') {
                // Globo de helio flotante e inflado (Rojo brillante volumétrico)
                const grad = ctx.createRadialGradient(-radius*0.2, -radius*0.3, radius*0.1, 0, 0, radius);
                grad.addColorStop(0, '#ff7675');
                grad.addColorStop(0.7, '#d63031');
                grad.addColorStop(1, '#810000');
                ctx.fillStyle = grad;

                ctx.beginPath();
                ctx.arc(0, -radius * 0.1, radius, 0, Math.PI * 2);
                ctx.fill();

                // Nudo del globo en la parte inferior
                ctx.fillStyle = '#d63031';
                ctx.beginPath();
                ctx.moveTo(-4, radius * 0.85);
                ctx.lineTo(4, radius * 0.85);
                ctx.lineTo(0, radius * 1.1);
                ctx.closePath(); ctx.fill();

                // Hilo de sujeción que oscila levemente
                ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, radius * 1.0);
                ctx.quadraticCurveTo(-10, radius * 1.6, 2, radius * 2.3);
                ctx.stroke();

            } else if (type === 'watermelon') {
                // Rebanada de Sandía
                ctx.fillStyle = '#27ae60'; // Corteza verde
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI, false);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#2ecc71'; // Capa verde clara
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.85, 0, Math.PI, false);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#ffffff'; // Parte blanca
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.78, 0, Math.PI, false);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#e74c3c'; // Pulpa roja deliciosa
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.68, 0, Math.PI, false);
                ctx.closePath(); ctx.fill();

                // Semillas negras
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(-radius * 0.3, radius * 0.3, 1.8, 0, Math.PI * 2);
                ctx.arc(0, radius * 0.45, 1.8, 0, Math.PI * 2);
                ctx.arc(radius * 0.3, radius * 0.3, 1.8, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 'duck') {
                // Patito de Goma Amarillo
                // Cuerpo
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.ellipse(0, radius * 0.2, radius * 0.8, radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cabeza
                ctx.beginPath();
                ctx.arc(radius * 0.35, -radius * 0.35, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Ala pequeña
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.ellipse(-radius * 0.2, radius * 0.1, radius * 0.35, radius * 0.2, Math.PI / 8, 0, Math.PI * 2);
                ctx.fill();

                // Pico de color naranja
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.moveTo(radius * 0.6, -radius * 0.35);
                ctx.lineTo(radius * 1.05, -radius * 0.3);
                ctx.lineTo(radius * 0.6, -radius * 0.18);
                ctx.closePath(); ctx.fill();

                // Ojo
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(radius * 0.3, -radius * 0.45, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        // --- RENDER GAME LOOP PRINCIPAL ---

        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#7bed9f';
            ctx.fillRect(0, height - 40, width, 40);
            drawBody(ground, '#574b90');

            drawProceduralSling();

            blocks.forEach(block => {
                ctx.save();
                ctx.translate(Math.floor(block.position.x), Math.floor(block.position.y));
                ctx.rotate(block.angle);
                
                const w = block.bounds.max.x - block.bounds.min.x;
                const h = block.bounds.max.y - block.bounds.min.y;

                if (block.label === 'bonus') {
                    drawProceduralBonus(block.bonusType, w / 2);
                } else {
                    drawProceduralBlock(block.label, w, h);
                }
                ctx.restore();
            });

            pigs.forEach(pig => {
                ctx.save();
                ctx.translate(Math.floor(pig.position.x), Math.floor(pig.position.y));
                ctx.rotate(pig.angle);
                const r = (pig.bounds.max.x - pig.bounds.min.x) / 2;
                drawProceduralPig(pig.pigType, r);
                ctx.restore();
            });

            if (bird && !bird.isDead) {
                ctx.save();
                ctx.translate(Math.floor(bird.position.x), Math.floor(bird.position.y));
                ctx.rotate(bird.angle);
                const r = (bird.bounds.max.x - bird.bounds.min.x) / 2;
                drawProceduralBird(currentBirdType, r);
                ctx.restore();
            }

            birdQueue.forEach((type, index) => {
                ctx.save();
                ctx.translate(slingPos.x - 40 - (index * 35), height - 25);
                drawProceduralBird(type, 13);
                ctx.restore();
            });

            drawExplosions();
        }

        function drawBody(body, color) {
            ctx.beginPath();
            const v = body.vertices;
            ctx.moveTo(Math.floor(v[0].x), Math.floor(v[0].y));
            for (let j = 1; j < v.length; j++) ctx.lineTo(Math.floor(v[j].x), Math.floor(v[j].y));
            ctx.lineTo(Math.floor(v[0].x), Math.floor(v[0].y));
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
        }

        function drawExplosions() {
            for (let i = activeExplosions.length - 1; i >= 0; i--) {
                const exp = activeExplosions[i];
                exp.timer++;
                
                const ratio = exp.timer / exp.maxTimer;
                const currentRadius = exp.radius * ratio;
                
                ctx.save();
                const grad = ctx.createRadialGradient(exp.x, exp.y, currentRadius * 0.1, exp.x, exp.y, currentRadius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                grad.addColorStop(0.2, 'rgba(255, 200, 0, 0.85)');
                grad.addColorStop(0.6, 'rgba(255, 50, 0, 0.6)');
                grad.addColorStop(1, 'rgba(128, 128, 128, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (exp.timer >= exp.maxTimer) {
                    activeExplosions.splice(i, 1);
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
